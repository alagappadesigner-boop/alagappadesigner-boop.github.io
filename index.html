<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alagappa Performing Arts Academy ID Card Generator</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#102f59}
.wrap{max-width:1250px;margin:auto;padding:24px}
h1{margin:0 0 6px;font-size:28px}
.sub{margin:0 0 18px;color:#667085}
.panel{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select,button{font:inherit}
input[type=text],input[type=date],input[type=file],select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033}
input:disabled{background:#f3f4f6;color:#667085}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}
.primary{background:#082d5c;color:#fff}
.secondary{background:#e7ecf3;color:#102f59}
.status{margin-top:10px;font-size:13px;color:#475467}
.hint{font-size:12px;color:#667085;margin-top:6px}
.card-wrap{display:flex;justify-content:center;align-items:flex-start;width:100%;overflow:hidden;padding:4px}
.card{position:relative;display:block;width:min(1024px,100%);max-width:100%;aspect-ratio:2048/1294;overflow:hidden;isolation:isolate;contain:paint;background:#fffdf6;flex:none}
.value{position:absolute;color:#062d5c;font-family:"Trebuchet MS",Arial,sans-serif;font-size:22px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card::before,.card::after{content:none !important;display:none !important}
.card .value::before,.card .value::after{content:none !important;display:none !important}

@media(max-width:750px){
  .grid{grid-template-columns:1fr}
  .field-label{font-size:12px}
  .field-colon{font-size:12px}
  .value{font-size:12px}
  #vInstitute{font-size:10px}
}
@media print{body{background:#fff}.wrap>h1,.wrap>.sub,.wrap>.panel{display:none!important}.card-wrap{padding:0}.card{width:101.6mm;height:63.8mm}}

.card .value{
  position:absolute !important;
  left:45.65% !important;
  width:48% !important;
  max-width:48% !important;
  color:#062d5c !important;
  font-family:"Trebuchet MS",Arial,sans-serif !important;
  font-size:20px !important;
  font-weight:700 !important;
  line-height:1 !important;
  letter-spacing:0 !important;
  text-align:left !important;
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  padding:0 !important;
  margin:0 !important;
  border:0 !important;
  background:transparent !important;
  text-shadow:none !important;
  box-shadow:none !important;
  z-index:3 !important;
  transform:none !important;
  filter:none !important;
  opacity:1 !important;
  backface-visibility:hidden !important;
  -webkit-font-smoothing:antialiased !important;
  contain:layout paint !important;
}
#vId{top:46.45% !important}
#vName{top:51.90% !important}
#vGrade{top:57.35% !important}
#vDob{top:62.80% !important}
#vInstitute{top:68.25% !important;font-size:17px !important}
#vJoining{top:73.70% !important}

@media(max-width:750px){
  .card .value{font-size:12px !important}
  #vInstitute{font-size:10px !important}
}

.card{position:relative !important;overflow:hidden !important;isolation:isolate !important;background:#fffdf6 !important;}
.card-background{position:absolute !important;inset:0 !important;width:100% !important;height:100% !important;display:block !important;margin:0 !important;padding:0 !important;border:0 !important;z-index:0 !important;pointer-events:none !important;user-select:none !important;}
.card-fields{position:absolute !important;inset:0 !important;width:100% !important;height:100% !important;margin:0 !important;padding:0 !important;border:0 !important;z-index:2 !important;pointer-events:none !important;}
.card-fields .value{display:block !important;position:absolute !important;transform:none !important;animation:none !important;transition:none !important;will-change:auto !important;}
.card-fields::before,.card-fields::after,.card-fields .value::before,.card-fields .value::after{content:none !important;display:none !important;}
</style>
</head>
<body>
<div class="wrap">
<h1>ALAGAPPA PERFORMING ARTS ACADEMY ID CARD GENERATOR</h1>
<p class="sub">Create a premium APAA Grade Examination Student ID Card — high-resolution PDF export for printing.</p>

<div class="panel">
  <div class="grid">
    <div>
      <label>Excel / CSV File (Import Excel)</label>
      <input id="file" type="file" accept=".xlsx,.xls,.csv">
      <div class="hint">Upload your Excel or CSV file. Columns are detected automatically.</div>
    </div>
    <div>
      <label>Search Student</label>
      <input id="search" type="text" placeholder="Type enrollment number or student name...">
    </div>
  </div>

  <div class="grid" style="margin-top:14px">
    <div>
      <label>Select Student</label>
      <select id="studentSelect"><option value="">Enter details below or upload Excel</option></select>
    </div>
    <div>
      <label>Status</label>
      <div id="status" class="status" style="margin-top:10px">Ready. You can type student details below.</div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="manual-title">Student Details</div>
  <div class="grid">
    <div><label>Student ID / Enrollment No.</label><input id="id" type="text" placeholder="e.g. ALGBIN0001"></div>
    <div><label>Name</label><input id="name" type="text" placeholder="Student name"></div>
    <div><label>Grade</label><input id="grade" type="text" placeholder="e.g. Pre - Grade"></div>
    <div><label>Date of Birth</label><input id="dob" type="text" placeholder="DD-MM-YYYY"></div>
    <div><label>Name of the Institution</label><input id="institute" type="text" placeholder="Institution name"></div>
    <div><label>Date of Joining</label><input id="joining" type="text" value="Aug 2026" placeholder="e.g. Aug 2026"></div>
  </div>
  <div class="actions">
    <button class="primary" id="download">Download High-Resolution PDF</button>
    <button class="primary" id="downloadZip" style="background:#0d5c2d;">Download All as ZIP</button>
    <button class="secondary" id="print">Print / Save as PDF</button>
    <button class="secondary" id="clear">Clear</button>
  </div>
</div>

<div class="panel">
  <div class="card-wrap">
    <div class="card" id="card">
      <img class="card-background" alt="Card Background" src="22.png">
      <div class="card-fields" aria-label="Student information">
        <div class="value" id="vId">—</div>
        <div class="value" id="vName">—</div>
        <div class="value" id="vGrade">—</div>
        <div class="value" id="vDob">—</div>
        <div class="value" id="vInstitute">—</div>
        <div class="value" id="vJoining">—</div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let students=[];
const fields=['id','name','grade','dob','institute','joining'];

function norm(v){return String(v??'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');}

function dateText(v){
  if(v instanceof Date && !isNaN(v)) return v.toLocaleDateString('en-GB');
  if(typeof v==='number' && window.XLSX){
    const d=XLSX.SSF.parse_date_code(v);
    if(d) return String(d.d).padStart(2,'0')+'-'+String(d.m).padStart(2,'0')+'-'+d.y;
  }
  return String(v??'').trim();
}

function mapRow(r){
  const getVal = (...keys) => {
    const keysObj = Object.keys(r);
    for (const key of keys) {
      const foundKey = keysObj.find(k => k && norm(k) === norm(key));
      if (foundKey !== undefined && r[foundKey] !== undefined && String(r[foundKey]).trim() !== '') {
        return r[foundKey];
      }
    }
    for (const key of keys) {
      const foundKey = keysObj.find(k => k && norm(k).includes(norm(key)));
      if (foundKey !== undefined && r[foundKey] !== undefined && String(r[foundKey]).trim() !== '') {
        return r[foundKey];
      }
    }
    return '';
  };

 return {
  id: getVal('enrollmentno', 'enrollment', 'studentid', 'studentno', 'id', 'regno', 'roll'),
  name: getVal('name', 'studentname', 'fullname', 'student'),
  grade: getVal('grade', 'class', 'level'),
  dob: dateText(getVal('dateofbirth', 'dob', 'birthdate', 'birthday')),
  institute: getVal('nameoftheinstitute', 'institute', 'institution', 'school', 'academy', 'center'),
  joining: dateText(getVal('dateofjoining', 'joining', 'joined', 'datejoined')) || 'Aug 2026'
 };
}

function setForm(s){
 if(!s)return;
 $('id').value=s.id\vert{}\vert{}'';$('name').value=s.name||'';
 $('grade').value=s.grade\vert{}\vert{}'';$('dob').value=s.dob||'';
 $('institute').value=s.institute\vert{}\vert{}'';$('joining').value=s.joining||'Aug 2026';
 update();
}

function current(){
 return {
  id:$('id').value.trim(),
  name:$('name').value.trim(),
  grade:$('grade').value.trim(),
  dob:$('dob').value.trim(),
  institute:$('institute').value.trim(),
  joining:$('joining').value.trim() || 'Aug 2026'
 };
}

const cardValueEls = Object.freeze({
  vId: document.getElementById('vId'),
  vName: document.getElementById('vName'),
  vGrade: document.getElementById('vGrade'),
  vDob: document.getElementById('vDob'),
  vInstitute: document.getElementById('vInstitute'),
  vJoining: document.getElementById('vJoining')
});

function update(){
  const s=current();
  cardValueEls.vId.textContent=s.id||'—';
  cardValueEls.vName.textContent=s.name||'—';
  cardValueEls.vGrade.textContent=s.grade||'—';
  cardValueEls.vDob.textContent=s.dob||'—';
  cardValueEls.vInstitute.textContent=s.institute||'—';
  cardValueEls.vJoining.textContent=s.joining||'—';
}

fields.forEach(f=>$(''+f).addEventListener('input',update));

$('clear').onclick=()=>{
  fields.forEach(f=>$(''+f).value='');
  $('joining').value='Aug 2026';$('status').textContent='Cleared. You can type student details.';
  update();
};

$('print').onclick=()=>window.print();

$('search').addEventListener('input',()=>{
 const q=norm($('search').value);
 const list=students.filter(s=>!q||norm(s.id).includes(q)||norm(s.name).includes(q)||norm(s.grade).includes(q));
 const sel=$('studentSelect'); 
 sel.innerHTML='';
 if(!list.length){
   sel.innerHTML='<option value="">No matching student</option>';
   return;
 }
 list.forEach((s)=>{
   const o=document.createElement('option');
   const origIdx = students.indexOf(s);
   o.value = origIdx;
   o.textContent=(s.id||'No ID')+' — '+(s.name||'Unnamed');
   sel.appendChild(o);
 });
 sel._list=list;
 if(list.length) {
   setForm(list[0]);
   sel.value = students.indexOf(list[0]);
 }
});

$('studentSelect').addEventListener('change',()=>{
  const idx = Number($('studentSelect').value);
  const s = students[idx];
  if(s) setForm(s);
});

$('file').addEventListener('change',e=>{
 const file=e.target.files[0]; 
 if(!file) return;
 $('status').textContent='Reading '+file.name+'...';
 
 if(!window.XLSX){
   $('status').textContent='Excel reader could not load. Please check your internet connection.';
   return;
 }

 const reader=new FileReader();
 reader.onload=ev=>{
  try{
   const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
   
   if(!matrix.length){
     throw new Error('The Excel sheet is empty.');
   }
   
   // Force row index 4 (Row 5 in Excel) where headers are located
   let hi = 4;
   
   const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true,range:hi});
   students=rows.map(mapRow).filter(s=>s.id||s.name);
   
   const sel=$('studentSelect');
   sel.innerHTML='';
   
   if(!students.length){
     $('status').textContent='Parsed file, but no student records were found. Check column headers.';
     return;
   }

   students.forEach((s,i)=>{
     const o=document.createElement('option');
     o.value=i;
     o.textContent=(s.id||'No ID')+' — '+(s.name||'Unnamed');
     sel.appendChild(o);
   });
   
   sel._list=students;
   sel.value=0;
   setForm(students[0]);
   $('status').textContent=`Successfully loaded ${students.length} student(s) from ${file.name}!`;
  }catch(err){
   console.error(err);
   $('status').textContent='Error reading file: ' + err.message;
  }
 };
 reader.readAsArrayBuffer(file);
});

$('download').onclick=async()=>{
 const s=current();
 if(!s.id&&!s.name){alert('Please enter student details first.');return;}
 if(!window.jspdf||!window.html2canvas){alert('PDF download library unavailable.');return;}

 $('status').textContent='Generating high-resolution PDF...';
 const card=$('card');
 const canvas=await html2canvas(card,{
  scale:6,
  useCORS:true,
  allowTaint:false,
  backgroundColor:'#fffdf6',
  logging:false,
  imageTimeout:0
 });

 const doc=new jspdf.jsPDF({
  orientation:'landscape',
  unit:'mm',
  format:[101.6,63.8],
  compress:false
 });
 doc.addImage(canvas.toDataURL('image/png'),'PNG',0,0,101.6,63.8,undefined,'NONE');
 const filename=(s.name||s.id||'Student').replace(/[^a-z0-9_-]+/gi,'_');
 doc.save('StudentID_'+filename+'.pdf');
 $('status').textContent='High-resolution PDF generated successfully.';
};

$('downloadZip').onclick=async()=>{
 if(!students.length){alert('Please upload an Excel file with students first.');return;}
 if(!window.JSZip||!window.jspdf||!window.html2canvas){alert('Required libraries are missing.');return;}

 const zip=new JSZip();
 const card=$('card');$('status').textContent=`Preparing ZIP archive for ${students.length} students...`;

 for(let i=0; i<students.length; i++){
  const s=students[i];
  setForm(s);
  $('status').textContent=`Processing student ${i+1} of ${students.length}: ${s.name||s.id}`;
  
  await new Promise(r=>setTimeout(r, 40));

  const canvas=await html2canvas(card,{
   scale:4,
   useCORS:true,
   allowTaint:false,
   backgroundColor:'#fffdf6',
   logging:false,
   imageTimeout:0
  });

  const doc=new jspdf.jsPDF({
   orientation:'landscape',
   unit:'mm',
   format:[101.6,63.8],
   compress:true
  });
  doc.addImage(canvas.toDataURL('image/png'),'PNG',0,0,101.6,63.8,undefined,'FAST');
  
  const pdfBlob=doc.output('blob');
  const filename=(s.name||s.id||('Student_'+i)).replace(/[^a-z0-9_-]+/gi,'_');
  zip.file(`StudentID_${filename}.pdf`, pdfBlob);
 }

 $('status').textContent='Compressing ZIP archive...';
 const content=await zip.generateAsync({type:'blob'});
 const link=document.createElement('a');
 link.href=URL.createObjectURL(content);
 link.download='All_Student_ID_Cards.zip';
 link.click();
 $('status').textContent=`Successfully generated ZIP containing ${students.length} ID cards.`;
};

update();
</script>
</body>
</html>
