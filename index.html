<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alagappa Performing Arts Academy Fee Receipt</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* [Your existing styles remain exactly as you provided] */
        :root { --primary-blue: #0b407b; --accent-gold: #cca43b; --text-dark: #1e293b; --bg-light: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f4f8; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .page { width: 100%; max-width: 1050px; }
        #receipt { background: #ffffff; width: 100%; padding: 20px; border-radius: 12px; border: 3px solid var(--primary-blue); margin-bottom: 20px; }
        .print-text-preview { display: none; font-weight: 600; color: var(--text-dark); }
        .buttons { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .buttons button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; color: #fff; font-weight: 700; }
        #download { background-color: var(--primary-blue); }
        #printBtn { background-color: var(--accent-gold); color: #000; }
        #clearForm { background-color: #ef4444; }
        @media print { .buttons, .live-ledger-container, input, select, textarea { display: none !important; } .print-text-preview { display: inline-block !important; } }
    </style>
</head>
<body>

<div class="page">
    <div id="receipt">
        <input type="text" id="name" placeholder="Name"> <span class="print-text-preview" id="print_name"></span>
        <input type="number" id="paidAmount" placeholder="Amount"> <span class="print-text-preview" id="print_paidAmount"></span>
        </div>

    <div class="buttons">
        <button id="download"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
        <button id="printBtn"><i class="fa-solid fa-print"></i> Print Receipt</button>
        <button id="exportExcel"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
        <button id="clearForm"><i class="fa-solid fa-trash"></i> Clear Form</button>
    </div>
</div>

<script>
    // 1. NUMBER TO WORDS HELPER
    function convertNumberToWords(amount) {
        if (amount === 0) return 'Zero';
        const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
        const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
        const num = amount.toString().split('.')[0];
        if (num.length > 9) return 'Overflow';
        let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        let str = '';
        str += n[1] != 0 ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
        str += n[2] != 0 ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
        str += n[3] != 0 ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
        str += n[4] != 0 ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
        str += n[5] != 0 ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) : '';
        return str.trim() + ' Only';
    }

    // 2. FORM VALIDATION & SYNC
    function validateReceiptForm() {
        const required = ['receiptNo', 'name', 'paidAmount', 'course'];
        for (let id of required) {
            if (!document.getElementById(id).value.trim()) { alert("Please fill " + id); return false; }
        }
        return true;
    }

    function syncPrintPreviews() {
        document.getElementById('print_name').innerText = document.getElementById('name').value;
        document.getElementById('print_paidAmount').innerText = '₹ ' + document.getElementById('paidAmount').value;
        // ... update all other print_ fields here
    }

    // 3. EVENT LISTENERS
    document.getElementById('printBtn').addEventListener('click', () => {
        if (!validateReceiptForm()) return;
        syncPrintPreviews();
        window.print();
    });

    document.getElementById('download').addEventListener('click', async () => {
        if (!validateReceiptForm()) return;
        syncPrintPreviews();
        const { jsPDF } = window.jspdf;
        const canvas = await html2canvas(document.getElementById('receipt'));
        const pdf = new jsPDF('l', 'mm', 'a4');
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 5, 5, 280, 150);
        pdf.save('Receipt.pdf');
    });

    document.getElementById('paidAmount').addEventListener('input', (e) => {
        document.getElementById('words').value = convertNumberToWords(e.target.value);
    });
</script>
</body>
</html>
